[workspace]
resolver = "3"
members = [
    "crates/univault-engine",
    "crates/grimvault-core",
    "crates/grimvault-gui",
    "crates/grimvault-io",
    "crates/univault-io",
    "crates/univault-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
