[package]
name = "grimvault-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only MCP server exposing Grim Dawn game data (characters and their builds, stashes, the vault store, skills, devotions, items, the record database) over stdio"

[lints]
workspace = true

[dependencies]
grimvault-core = { path = "../grimvault-core" }
grimvault-io = { path = "../grimvault-io" }
univault-engine = { path = "../univault-engine" }
univault-io = { path = "../univault-io" }
rmcp = { version = "3.1.4", features = [
    "server",
    "macros",
    "transport-io",
    "schemars",
] }
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
thiserror = "2"

[dev-dependencies]
univault-engine = { path = "../univault-engine", features = ["test-util"] }
